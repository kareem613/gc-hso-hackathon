apiVersion: v1
kind: PersistentVolume
metadata:
  name: datasets-pv
spec:
  accessModes:
    - ReadOnlyMany
  capacity:
    storage: 5Gi
  storageClassName: gcsfuse-sc
  claimRef:
    namespace: default
    name: datasets-pvc
  mountOptions:
    - implicit-dirs
    - uid=101
    - gid=101
  csi:
    driver: gcsfuse.csi.storage.gke.io
    volumeHandle: PROJECT_ID-datasets
    readOnly: true
    volumeAttributes:
      skipCSIBucketAccessCheck: "true"
