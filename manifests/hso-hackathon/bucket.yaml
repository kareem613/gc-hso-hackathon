apiVersion: storage.cnrm.cloud.google.com/v1beta1
kind: StorageBucket
metadata:
  name: hso-datasets-bucket
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    cnrm.cloud.google.com/project-id: PROJECT_ID
    cnrm.cloud.google.com/force-destroy: "true"
spec:
  resourceID: PROJECT_ID-datasets
  location: REGION
  uniformBucketLevelAccess: true
---
apiVersion: iam.cnrm.cloud.google.com/v1beta1
kind: IAMServiceAccount
metadata:
  name: hso-app-gsa
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    cnrm.cloud.google.com/project-id: PROJECT_ID
spec:
  displayName: "HSO Console Workload Identity GSA"
---
apiVersion: iam.cnrm.cloud.google.com/v1beta1
kind: IAMPolicyMember
metadata:
  name: hso-app-wi-binding
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    cnrm.cloud.google.com/project-id: PROJECT_ID
spec:
  member: serviceAccount:PROJECT_ID.svc.id.goog[hso-hackathon/hso-app-sa]
  role: roles/iam.workloadIdentityUser
  resourceRef:
    apiVersion: iam.cnrm.cloud.google.com/v1beta1
    kind: IAMServiceAccount
    name: hso-app-gsa
---
apiVersion: iam.cnrm.cloud.google.com/v1beta1
kind: IAMPolicyMember
metadata:
  name: hso-app-bucket-viewer
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    cnrm.cloud.google.com/project-id: PROJECT_ID
spec:
  member: serviceAccount:hso-app-gsa@PROJECT_ID.iam.gserviceaccount.com
  role: roles/storage.objectViewer
  resourceRef:
    apiVersion: storage.cnrm.cloud.google.com/v1beta1
    kind: StorageBucket
    name: hso-datasets-bucket
